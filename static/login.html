<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Resume Screener</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Smart Resume Screener</h1>
    <p class="hint">Sign in to screen resumes against job descriptions.</p>

    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" placeholder="abc@gmail.com" autocomplete="username">

    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password">

    <button id="loginBtn" type="button">Sign In</button>
    <p id="loginStatus" class="status"></p>
  </div>

  <script src="/static/login.js"></script>
</body>
</html>
